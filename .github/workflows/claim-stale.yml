# 认领过期：认领 14 天还没有关联的提交请求，提醒一次；21 天还没有，自动释放。每天查一次。
name: 认领过期
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  issues: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo, DAY = 86400000, now = Date.now()
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: '实验室,已认领' })
            for (const issue of issues) {
              const who = issue.assignees[0]?.login
              if (!who) continue
              const events = await github.paginate(github.rest.issues.listEventsForTimeline, { owner, repo, issue_number: issue.number })
              const assigned = events.filter(e => e.event === 'assigned').pop()
              if (!assigned) continue
              const since = new Date(assigned.created_at).getTime()
              // 认领之后有没有提交请求提到这个议题
              const linked = events.some(e => e.event === 'cross-referenced' && e.source?.issue?.pull_request && new Date(e.created_at).getTime() > since)
              if (linked) continue
              const days = (now - since) / DAY
              const reminded = events.some(e => e.event === 'commented' && new Date(e.created_at).getTime() > since && e.body?.includes('认领已经 14 天'))
              if (days >= 21) {
                await github.rest.issues.removeAssignees({ owner, repo, issue_number: issue.number, assignees: [who] })
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: '已认领' }).catch(() => {})
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['可认领'] })
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `@${who} 认领已经 21 天，还没有看到关联的提交请求，这一间重新开放认领了。之后想继续做，可以再回复 \`/认领\`。` })
              } else if (days >= 14 && !reminded) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `@${who} 认领已经 14 天，还没有看到关联的提交请求。还在做的话请提交规格卡（说明里写 \`关联 #${issue.number}\`），或者回复一句说明进度；7 天后没有动静，这一间会重新开放认领。` })
              }
            }
